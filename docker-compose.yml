# PostgreSQL 17 + pgvector + pg_textsearch (BM25) untuk pengembangan lokal (docker/db/Dockerfile).
# Jalankan: docker compose up -d --build   |   Hentikan: docker compose down   (data tetap di volume led_pgdata)
services:
  db:
    build: ./docker/db
    image: led-lamteknik-db:pg17-textsearch-1.5.1
    command: ["postgres", "-c", "shared_preload_libraries=pg_textsearch"]
    container_name: led-lamteknik-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: led
      POSTGRES_PASSWORD: led_lokal_ganti
      POSTGRES_DB: led_lamteknik
    ports:
      - "5432:5432"
    volumes:
      - led_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U led -d led_lamteknik"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  led_pgdata:
